<!DOCTYPE html>
<html lang="en" data-color-mode=light data-light-theme=light data-dark-theme=dark>
<head>
  <meta charset="utf-8" />
  <title>README.md - Grip</title>
  <link rel="icon" href="/__/grip/static/favicon.ico" />
  <style>
    /* Page tweaks */
    .preview-page {
      margin-top: 64px;
    }
    /* Discussion tweaks */
    .discussion-timeline.wide {
      width: 920px;
    }
    .timeline-comment-wrapper > .timeline-comment:after,
    .timeline-comment-wrapper > .timeline-comment:before {
      content: none;
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="preview-page" class="preview-page" data-autorefresh-url="">
    <div class="container">
      <div class="repository-with-sidebar repo-container with-full-navigation">

        
          <div class="discussion-timeline ">
            <div class="timeline-comment-wrapper">
              <div class="timeline-comment">
                <div class="comment">
                  <div class="comment-content">
                    <div id="grip-content" class="comment-body markdown-body markdown-format">
                      <h1>Simple Test ✓</h1>

<p>This is just a simple Unicode Markdown test.</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        

      </div>
    </div>
  </div>
  <div>&nbsp;</div>
  </div>
  <script src="/__/grip/static/mermaid.min.js"></script>
  <script>
    if (typeof mermaid !== 'undefined') mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: document.documentElement.dataset.colorMode === 'dark' ? 'dark' : 'default'
    });
    var mermaidQueue = Promise.resolve();

    function renderMermaid() {
      if (typeof mermaid === 'undefined') return;
      mermaidQueue = mermaidQueue.then(function() {
        return mermaid.run({
          nodes: document.querySelectorAll('#grip-content .mermaid:not([data-processed])'),
          suppressErrors: true
        });
      }).catch(function(error) {
        console.error('Mermaid rendering failed:', error);
      });
    }

    function showCanonicalImages() {
      var images = document.getElementsByTagName('img');
      if (!images) {
        return;
      }
      for (var index = 0; index < images.length; index++) {
        var image = images[index];
        if (image.getAttribute('data-canonical-src') && image.src !== image.getAttribute('data-canonical-src')) {
          image.src = image.getAttribute('data-canonical-src');
        }
      }
    }

    function scrollToHash() {
      if (location.hash && !document.querySelector(':target')) {
        var element = document.getElementById('user-content-' + location.hash.slice(1));
        if (element) {
           element.scrollIntoView();
        }
      }
    }

    function autorefreshContent(eventSourceUrl) {
      var initialTitle = document.title;
      var contentElement = document.getElementById('grip-content');
      var source = new EventSource(eventSourceUrl);
      var isRendering = false;

      source.onmessage = function(ev) {
        var msg = JSON.parse(ev.data);
        if (msg.updating) {
          isRendering = true;
          document.title = '(Rendering) ' + document.title;
        } else {
          isRendering = false;
          document.title = initialTitle;
          contentElement.innerHTML = msg.content;
          showCanonicalImages();
          renderMermaid();
        }
      }

      source.onerror = function(e) {
        if (e.readyState === EventSource.CLOSED && isRendering) {
          isRendering = false;
          document.title = initialTitle;
        }
      }
    }

    window.onhashchange = function() {
      scrollToHash();
    }

    window.onload = function() {
      scrollToHash();
    }

    showCanonicalImages();
    renderMermaid();

    var autorefreshUrl = document.getElementById('preview-page').getAttribute('data-autorefresh-url');
    if (autorefreshUrl) {
      autorefreshContent(autorefreshUrl);
    }
  </script>
</body>
</html>
